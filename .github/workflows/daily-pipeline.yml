name: Kids Video Daily Pipeline

on:
  schedule:
    - cron: '0 3 * * *'   # Runs at 3:00 AM UTC = ~9:00 AM Bangladesh time (UTC+6)
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env << EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          STABILITY_API_KEY=${{ secrets.STABILITY_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_USER_ID=${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN=${{ secrets.TIKTOK_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRET_JSON=client_secret.json
          PUBLIC_VIDEO_BASE_URL=${{ secrets.PUBLIC_VIDEO_BASE_URL }}
          EOF

      - name: Restore pipeline memory
        uses: actions/cache@v4
        with:
          path: pipeline_state.json
          key: pipeline-memory-${{ github.run_number }}
          restore-keys: pipeline-memory-

      - name: Run pipeline
        run: python scripts/run_pipeline.py

      - name: Save pipeline memory
        uses: actions/cache@v4
        with:
          path: pipeline_state.json
          key: pipeline-memory-${{ github.run_number }}

      - name: Upload output video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: output/final_output_*.mp4
          retention-days: 7
